version 15.3
no service pad
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname sj-ap-01
!
!
logging rate-limit console 9
enable secret 8 $8$7u/HfF4dA/knGX$SK0z2A2P0B9r0Vw2XfFD57JF44/RLoNiRUiyhJ1BC3M
!
no aaa new-model
no ip source-route
no ip cef
ip domain name sj.local
!
!
!
!
dot11 pause-time 100
dot11 syslog
!
dot11 ssid muhHTE99
   band-select
   authentication open 
   authentication key-management wpa version 2
   guest-mode
   wpa-psk ascii 7 013715345E0E4B583B5D4B1E545110340415
!
!
!
no ipv6 cef
!
!
username mla privilege 15 secret 8 $8$T68gODAQvTtpP3$yNPNovBiJKKVrwJ3NWtB6DplOSO4J5PWvBtQVeQvPRA
!
!
bridge irb
!
!
!
interface Dot11Radio0
 no ip address
 !
 encryption mode ciphers aes-ccm tkip 
 !
 ssid muhHTE99
 !
 antenna gain 0
 channel least-congested 2412 2437 2462
 station-role root
 bridge-group 1
 bridge-group 1 subscriber-loop-control
 bridge-group 1 spanning-disabled
 bridge-group 1 block-unknown-source
 no bridge-group 1 source-learning
 no bridge-group 1 unicast-flooding
!
interface Dot11Radio1
 no ip address
 shutdown
 antenna gain 0
 peakdetect
 no dfs band block
 channel dfs
 station-role root
 bridge-group 1
 bridge-group 1 subscriber-loop-control
 bridge-group 1 spanning-disabled
 bridge-group 1 block-unknown-source
 no bridge-group 1 source-learning
 no bridge-group 1 unicast-flooding
!
interface GigabitEthernet0
 no ip address
 duplex auto
 speed auto
 bridge-group 1
 bridge-group 1 spanning-disabled
 no bridge-group 1 source-learning
!
interface GigabitEthernet1
 no ip address
 duplex auto
 speed auto
 bridge-group 1
 bridge-group 1 spanning-disabled
 no bridge-group 1 source-learning
!
interface BVI1
 mac-address 2cd0.2d57.d164
 ip address 192.168.175.2 255.255.255.0
 ipv6 address dhcp
 ipv6 address autoconfig
 ipv6 enable
!
ip forward-protocol nd
no ip http server
no ip http secure-server
ip http help-path http://www.cisco.com/warp/public/779/smbiz/prodconfig/help/eag
!
!
bridge 1 route ip
!
!
!
line con 0
line vty 0 4
 login local
 transport input all
!
end
