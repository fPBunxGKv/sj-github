{% for field in form %}
    {% if field.name != 'startnum' or form.instance.pk %}
    <td>
        {{ field }}
        {% if field.errors %}
            <div class="text-danger">
                {% for error in field.errors %}
                    <small>{{ error }}</small><br>
                {% endfor %}
            </div>
        {% endif %}
    </td>
    {% else %}
    <td>
        <input type="hidden" name="startnum" type="number" value="0">
    </td>
    {% endif %}
{% endfor %}

<td>
    <div class="d-flex gap-2">
    {% if form.instance.pk %}
        <button class="btn btn-primary" name="save" value="{{ form.instance.id }}">
            Speichern
        </button>
        <button formnovalidate class="btn btn-outline-secondary btn-sm" name="cancel" value="{{ form.instance.id }}" title="Abbrechen">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-x-lg" viewBox="0 0 16 16">
                <path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z"/>
            </svg>
        </button>
    {% else %}
        <button class="btn btn-success" name="save" value="0">
            Anlegen
        </button>
        <button formnovalidate class="btn btn-outline-secondary btn-sm" name="cancel" value="{{ form.instance.id }}" title="Abbrechen">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-x-lg" viewBox="0 0 16 16">
                <path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z"/>
            </svg>
        </button>
{% endif %}
    </div>
</td>
